# Reverse proxy de nginx para SOJA.
#
# Se instala en /etc/nginx/sites-available/soja (lo hace setup-vps.sh).
# Next escucha sólo en 127.0.0.1:3000; lo único expuesto a internet es nginx.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # `_` acepta cualquier Host: alcanza para entrar por el IP del VPS.
    # Cuando tengas dominio, poné acá `server_name tienda.tudominio.com;` y
    # corré `certbot --nginx` para el HTTPS.
    server_name _;

    # El diseñador acepta arte de hasta 15 MB (src/server/storage.ts) y el
    # default de nginx es 1 MB. Sin esto, subir un archivo grande devuelve un
    # 413 antes de llegar a la app.
    client_max_body_size 20m;

    # El arte y los mockups los sirve nginx directo del disco, NO Next.
    #
    # Next arma la lista de archivos de public/ cuando arranca el proceso: lo
    # que se sube después queda en 404 hasta el próximo reinicio. En Render no
    # se nota porque todo va a S3, pero con STORAGE_DRIVER=local es justo el
    # caso de uso: el cliente sube su arte y no lo ve. nginx lee del
    # filesystem en cada request, así que no tiene ese problema.
    #
    # Sigue siendo el mismo origen que la app, que es lo que necesita el canvas
    # para exportar el mockup sin quedar "tainted".
    location /uploads/ {
        alias /home/soja/soja-web/public/uploads/;
        try_files $uri =404;
        access_log off;
        # Los nombres llevan uuid: el contenido de una URL nunca cambia.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering, el streaming de los Server Components llega de a
        # pedazos en vez de todo junto al final.
        proxy_buffering off;

        # Generar el mockup y guardar el pedido puede tardar más que el
        # minuto que nginx espera por defecto.
        proxy_read_timeout 300s;
    }
}
