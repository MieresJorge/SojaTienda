# Reverse proxy de nginx para SOJA.
#
# Se instala en /etc/nginx/sites-available/soja (lo hace setup-vps.sh).
# Next escucha sólo en 127.0.0.1:3000; lo único expuesto a internet es nginx.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # `_` acepta cualquier Host: alcanza para entrar por el IP del VPS.
    # Cuando tengas dominio, poné acá `server_name tienda.tudominio.com;` y
    # corré `certbot --nginx` para el HTTPS.
    server_name _;

    # El diseñador acepta arte de hasta 15 MB (src/server/storage.ts) y el
    # default de nginx es 1 MB. Sin esto, subir un archivo grande devuelve un
    # 413 antes de llegar a la app.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering, el streaming de los Server Components llega de a
        # pedazos en vez de todo junto al final.
        proxy_buffering off;

        # Generar el mockup y guardar el pedido puede tardar más que el
        # minuto que nginx espera por defecto.
        proxy_read_timeout 300s;
    }
}
